<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: the day's run is a race bib (pinned, perforated, number huge); above it the week as a km bar chart; below it fuel as a timeline rail. Night-track palette: graphite, chalk paper, sodium-lamp amber. */
:root{
  --bg:#0E0F11; --surface:#16171A; --raise:#1E1F23; --line:#27282D; --ink:#F1EFEA; --muted:#8A8986;
  --accent:#FFB547; --accent-ink:#1A1204; --ok:#56C58C; --ok-ink:#06210F;
  --paper:#ECEEF0; --paper-ink:#101114; --paper-muted:#5E636B; --paper-line:#C9CDD3;
  --slate:#2C3542; --slate-ink:#E6EAF0;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#E4E6E9; --surface:#F7F8F9; --raise:#FFFFFF; --line:#D3D6DB; --ink:#111215; --muted:#5F626A;
  --accent:#C77400; --accent-ink:#FFFFFF; --ok:#1C8A53; --ok-ink:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#101114; --paper-muted:#5E636B; --paper-line:#D5D9DE;
  --slate:#2C3542; --slate-ink:#E6EAF0; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#E4E6E9; --surface:#F7F8F9; --raise:#FFFFFF; --line:#D3D6DB; --ink:#111215; --muted:#5F626A;
  --accent:#C77400; --accent-ink:#FFFFFF; --ok:#1C8A53; --ok-ink:#FFFFFF;
  --paper:#FFFFFF; --paper-ink:#101114; --paper-muted:#5E636B; --paper-line:#D5D9DE;
  --slate:#2C3542; --slate-ink:#E6EAF0; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 36px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mark{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.mark i{font-style:normal;color:var(--accent)}
.tabs{display:flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.tabs button{padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* date */
.datehead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px}
.date{display:flex;flex-direction:column;gap:2px;min-width:0}
.date .dow{font-family:var(--display);font-weight:800;font-size:62px;line-height:.82;text-transform:uppercase;letter-spacing:.005em}
.date .dow span{color:var(--accent)}
.date .sub{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring.full .val{stroke:var(--ok)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700}
.navrow{display:flex;gap:6px;align-items:center}
.navrow button{height:30px;min-width:30px;padding:0 9px;border-radius:999px;border:1px solid var(--line);font-size:14px;line-height:1;color:var(--muted)}
.navrow button:hover{color:var(--ink)}
.navrow button:disabled{opacity:.3;cursor:default}
.navrow .today{color:var(--accent);border-color:var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}

/* week km chart */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 7px;border-radius:12px;border:1px solid transparent;transition:background .2s}
.day:disabled{opacity:.28;cursor:default}
.day .col{width:100%;height:52px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.day .kmv{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day .b{width:62%;max-width:26px;border-radius:5px 5px 2px 2px;background:color-mix(in srgb,var(--muted) 45%,var(--line));position:relative;overflow:hidden}
.day .b.hot{background:color-mix(in srgb,var(--accent) 35%,var(--line))}
.day .b.hot+.x,.day .kmv.hot{color:var(--accent)}
.day .b.done{background:var(--ok)}
.day .b.zero{height:4px!important;width:4px;border-radius:9px}
.day .dl{font-family:var(--mono);font-size:10px;color:var(--muted)}
.day .dn{font-family:var(--display);font-weight:800;font-size:19px;line-height:.9}
.day.sel{background:var(--surface);border-color:var(--line)}
.day.now .dn{color:var(--accent)}

/* the bib */
.bib{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:18px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04),0 18px 40px -22px rgba(0,0,0,.55);animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
.bib-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 18px;background:var(--slate);color:var(--slate-ink);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.bib.hot .bib-top{background:#FFB547;color:#1A1204}
.pin{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.pin.a{top:52px;left:14px}.pin.b{top:52px;right:14px}
.bib-num{display:flex;justify-content:center;align-items:flex-start;gap:6px;padding:22px 18px 6px}
.bib-num .n{font-family:var(--display);font-weight:900;font-size:168px;line-height:.78;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bib-num .u{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;writing-mode:vertical-rl;color:var(--paper-muted);margin-top:4px}
.bib-name{text-align:center;padding:4px 22px 18px;display:flex;flex-direction:column;gap:4px;align-items:center}
.bib-name h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.bib-name p{margin:0;color:var(--paper-muted);font-size:14px;max-width:36ch;text-wrap:pretty}
.tear{position:relative;height:0;border-top:2px dashed var(--paper-line);margin:0 14px}
.tear::before,.tear::after{content:'';position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.tear::before{left:-26px}.tear::after{right:-26px}
.stub{padding:12px 14px 14px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:12px;background:var(--paper-ink);color:var(--paper);font-weight:700;font-size:15px;letter-spacing:.01em;transition:background .2s,transform .1s}
.go:active{transform:scale(.985)}
.go .box{border-color:color-mix(in srgb,var(--paper) 45%,transparent)}
.go[aria-checked="true"]{background:var(--ok);color:var(--ok-ink)}
.go[aria-checked="true"] .box{background:var(--ok-ink);border-color:var(--ok-ink)}
.go[aria-checked="true"] .box svg{stroke:var(--ok)}

/* rest day */
.rest{position:relative;border:1px dashed var(--line);border-radius:18px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.rest .word{font-family:var(--display);font-weight:900;font-size:clamp(56px,18vw,84px);line-height:.8;text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px var(--muted);letter-spacing:.01em}
.rest p{margin:0;color:var(--muted);max-width:40ch}
.rest .next{color:var(--ink)}
.rest .next b{color:var(--accent);font-weight:600}

/* checkbox */
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.box svg{width:13px;height:13px;opacity:0;stroke:var(--bg);transition:opacity .15s}
[aria-checked="true"] .box{background:var(--ok);border-color:var(--ok)}
[aria-checked="true"] .box svg{opacity:1}

/* sections */
section{display:flex;flex-direction:column;gap:10px}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh h3{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;margin:0;letter-spacing:.03em;text-transform:uppercase}
.sh .aside{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sh .aside b{color:var(--accent);font-weight:700}

/* fuel timeline */
.fuel{position:relative;display:flex;flex-direction:column}
.fuel::before{content:'';position:absolute;left:10px;top:14px;bottom:14px;width:2px;background:var(--line);border-radius:2px}
.meal{position:relative;display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:start;padding:11px 0;text-align:left;width:100%}
.meal .box{border-radius:50%;background:var(--bg);margin-top:1px}
.meal .it{min-width:0;display:flex;flex-direction:column;gap:3px}
.meal .t{font-weight:700;font-size:15px}
.meal .d{color:var(--muted);font-size:13.5px;text-wrap:pretty}
.meal .opt{font-size:12.5px;color:var(--muted)}
.meal .opt b{color:var(--ink);font-weight:600}
.meal .g{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);padding-top:2px;white-space:nowrap}
.meal[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
.meal[aria-checked="true"] .d,.meal[aria-checked="true"] .opt{opacity:.55}
.meal[aria-checked="true"] .g{color:var(--ok)}
details{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::after{content:' +'}
details[open] summary::after{content:' –'}
.swap{display:grid;grid-template-columns:1fr auto;gap:5px 16px;margin-top:10px}
.swap .mono{color:var(--ink);font-size:12px;text-align:right}

/* daily toggles */
.daily{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:background .2s,border-color .2s}
.tog .it{display:flex;flex-direction:column;min-width:0}
.tog .t{font-weight:700}
.tog .d{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tog[aria-checked="true"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}

/* gym (when it comes back) */
.lift{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px solid var(--line)}
.lift .exrow:first-child{border-top:0}
.ex{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 0;text-align:left;width:100%}
.ex .it{min-width:0;display:flex;flex-direction:column;gap:2px}
.ex .t{font-weight:600}
.ex .d{font-size:13px;color:var(--muted)}
.ex .d .mono{color:var(--ink);font-size:12px}
.ex .last{color:var(--accent);font-size:12px}
.ex[aria-checked="true"] .t{color:var(--muted);text-decoration:line-through}
.loadwrap{display:flex;align-items:center;gap:5px;padding-top:9px}
.load{width:58px;height:34px;border:1px solid var(--line);border-radius:9px;background:var(--raise);color:var(--ink);font-family:var(--mono);font-size:15px;text-align:center;padding:0 4px}
.load:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.loadwrap span{font-size:10.5px;color:var(--muted);font-family:var(--mono)}

footer{display:flex;justify-content:center}
.sync{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.sync::before{content:'';display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--muted);margin-right:7px;vertical-align:1px}
.sync.ok::before{background:var(--ok)}
.sync.warn::before{background:var(--accent)}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}

/* plan */
.phead{display:flex;flex-direction:column;gap:6px}
.phead .big{font-family:var(--display);font-weight:900;font-size:104px;line-height:.8;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.phead .big small{font-size:28px;font-weight:800;color:var(--muted);letter-spacing:.02em;margin-left:6px}
.lane{position:relative;height:14px;border-radius:99px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 12.5%),var(--surface);border:1px solid var(--line);overflow:hidden}
.lane i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.lane .flag{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:9px;font-family:var(--mono);color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.stat{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.stat .v{font-family:var(--display);font-weight:800;font-size:34px;line-height:.85;font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:var(--muted);margin-left:2px}
.weeks{display:flex;flex-direction:column}
.wk{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.weeks .wk:first-child{border-top:0}
.wk-n{font-family:var(--display);font-weight:900;font-size:34px;line-height:.85;color:var(--muted)}
.wk.cur .wk-n{color:var(--accent)}
.wk-body{display:flex;flex-direction:column;gap:7px;min-width:0}
.wk-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.wk-top .mono{font-size:12px;color:var(--ink)}
.wkbar{height:8px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.wkbar s{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:99px;text-decoration:none}
.wkbar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.wk.race .wk-top span:first-child{color:var(--accent)}
.goals{display:flex;flex-direction:column}
.goal{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.goals .goal:first-child{border-top:0}
.goal .gd{display:flex;flex-direction:column;align-items:center;line-height:1}
.goal .gd b{font-family:var(--display);font-weight:900;font-size:34px;line-height:.85}
.goal .gd span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.goal .gn{display:flex;flex-direction:column;gap:2px;min-width:0}
.goal .gn strong{font-weight:700}
.goal .gn small{font-size:12.5px;color:var(--muted)}
.goal .gl{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap}
.goal.next .gd b,.goal.next .gl{color:var(--accent)}
.goal.done{opacity:.45}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.date .dow{font-size:52px}.bib-num .n{font-size:140px}.phead .big{font-size:88px}}
</style>

const pad=n=>String(n).padStart(2,'0');

const addDays=(k,n)=>{const d=fromKey(k);d.setUTCDate(d.getUTCDate()+n);return toKey(d);};

function gymKeyFor(k){const dow=fromKey(k).getUTCDay();return GYM_ON?(GYM_BY_DOW[dow]||null):null;}
function plan(k){
 if(k<START||k>END) return null;
 const dow=fromKey(k).getUTCDay();
 const items=[];const blocks={dow};
 const r=RUNS[k];
 if(r){blocks.run=r;items.push('run');}
 const gk=gymKeyFor(k);
 if(gk){const g=GYM[gk]||CASA[gk];blocks.gym=g;blocks.gymKey=gk;blocks.casa=!!CASA[gk];g[2].forEach((_,i)=>items.push('g'+i));}
 if(GYM_ON&&(dow===1||dow===3)){blocks.bike='20–30 min leve';items.push('bike');}
 if(dow===0&&!r){blocks.along=true;items.push('along');}
 blocks.meals=meals(r&&(r[0]==='longao'||r[0]==='prova')?'long':(dow===0&&!r?'rest':'normal'));blocks.meals.forEach(m=>items.push(m[0]));
 items.push('creatina','agua');
 blocks.items=items;
 return blocks;
}
function stats(k){const p=plan(k);if(!p)return null;const s=state[k]||{};const done=p.items.filter(i=>s[i]).length;return {done,total:p.items.length};}

function renderPlan(){

 all.forEach(k=>{const p=plan(k),s=state[k]||{};const r=RUNS[k];
  if(r){kmT+=r[1];runT++;if(s.run){kmD+=r[1];runD++;}}
  if(p.gym){gymT++;if(p.gym[2].every((_,i)=>s['g'+i]))gymD++;}
  p.meals.forEach(m=>{if(k<=TODAY){mealT++;if(s[m[0]])mealD++;}});
  if(k<=TODAY){past++;const st=stats(k);if(st.done===st.total)full++;}
 });
 const curW=TODAY<START?0:TODAY>END?NWEEKS:weekNum(TODAY);
 const daysLeft=Math.max(0,Math.round((fromKey(END)-fromKey(TODAY))/864e5));
 let h=`<div class="phead"><span class="lbl">Prova de 8 km · 13 dez · faltam ${daysLeft} dias</span>

 const nextG=GOALS.find(g=>g[0]>=TODAY);
 h+=`<section><div class="sh"><h3>Metas</h3><span class="aside">provas</span></div><div class="goals">`;
 GOALS.forEach(g=>{const dd=fromKey(g[0]),left=Math.round((dd-fromKey(TODAY))/864e5);
  h+=`<div class="goal ${g===nextG?'next':''} ${left<0?'done':''}"><span class="gd"><b>${dd.getUTCDate()}</b><span>${MON[dd.getUTCMonth()]} ${String(dd.getUTCFullYear()).slice(2)}</span></span><span class="gn"><strong>${esc(g[1])}</strong><small>${esc(g[2])}</small></span><span class="gl">${left<0?'feita':left===0?'hoje':(g[3]?'~':'')+left+' dias'}</span></div>`;});
 h+=`</div></section>`;
 h+=`<div class="stats">
  <div class="stat"><span class="lbl">Corridas</span><span class="v">${runD}<small>/${runT}</small></span></div>
  ${GYM_ON?`<div class="stat"><span class="lbl">Academia</span><span class="v">${gymD}<small>/${gymT}</small></span></div>`:''}
  <div class="stat"><span class="lbl">Dieta</span><span class="v">${pc(mealD,mealT)}<small>%</small></span></div>
  <div class="stat"><span class="lbl">Dias 100%</span><span class="v">${full}<small>/${past}</small></span></div>
 </div>`;

 h+=`<section><div class="sh"><h3>Semanas</h3><span class="aside">km planejados</span></div><div class="weeks">`;
 for(let n=1;n<=NWEEKS;n++){const days=weekDays(n),[t,dn]=W[n-1];
  const longR=days.map(k=>RUNS[k]).find(r=>r&&(r[0]==='longao'||r[0]==='prova'));
  const tag=n===NWEEKS?'Prova':n===4?'Descarga':longR?'Longão '+kmFmt(longR[1])+' km':'';
  h+=`<button class="wk ${n===curW?'cur':''} ${n===NWEEKS?'race':''}" data-w="${n}"><span class="wk-n">${pad(n)}</span><span class="wk-body"><span class="wk-top"><span>${fmtD(days[0])} – ${fmtD(days[6])} · ${tag}</span><span class="mono">${kmFmt(r1(dn))}/${kmFmt(r1(t))}</span></span><span class="wkbar"><s style="width:${t/maxW*100}%"></s><i style="width:${dn/maxW*100}%"></i></span></span></button>`;}
 h+='</div></section>';
 document.getElementById('main').innerHTML=h;
}
function setView(v){view=v;document.getElementById('tabDay').setAttribute('aria-selected',v==='day');document.getElementById('tabPlan').setAttribute('aria-selected',v==='plan');

function lastLoad(gk,i,before){
 for(let k=addDays(before,-1);k>=START;k=addDays(k,-1)){if(gymKeyFor(k)===gk){const v=(loads[k]||{})['g'+i];if(v)return {v,k};}}

function exRow(i,e,gk){

const TYPE={leve:['Corrida leve',false,'Ritmo de conversa. No fim, 4–6 acelerações soltas de 20 s.'],

  return `<article class="bib ${hot?'hot':''}"><div class="bib-top"><span>${label}</span><span>S${weekNum(k)} · Runna</span></div>

 const nx=RUNS[addDays(k,1)];

function render(){
 if(view==='plan'){renderPlan();return;}
 const d=fromKey(sel),dow=d.getUTCDay();
 document.getElementById('title').innerHTML=DOW3[dow]+' <span>'+d.getUTCDate()+'</span>';
 document.getElementById('eyebrow').textContent=MONF[d.getUTCMonth()]+' · Semana '+weekNum(sel)+'/'+NWEEKS;
 document.getElementById('todayBtn').hidden=(sel===TODAY)||TODAY<START||TODAY>END;
 document.getElementById('prev').disabled=sel<=START;

 const mon=addDays(sel,-((dow+6)%7));

  wk+=`<button class="day ${k===sel?'sel':''} ${k===TODAY?'now':''}" data-d="${k}" ${s?'':'disabled'} aria-label="${DOW[dd.getUTCDay()]} ${dd.getUTCDate()}${r?', '+kmFmt(r[1])+' km':''}"><span class="col"><span class="kmv ${hot?'hot':''}">${r?kmFmt(r[1]):''}</span><span class="b ${r?'':'zero'} ${hot?'hot':''} ${done?'done':''}" style="height:${hgt}px"></span></span><span class="dl">${DOWS[dd.getUTCDay()]}</span><span class="dn">${dd.getUTCDate()}</span></button>`;}
 document.getElementById('week').innerHTML=wk;

 const main=document.getElementById('main');

  h+='</div></section>';}

 h+=`<section><div class="sh"><h3>Combustível</h3><span class="aside"><b>${pDone}</b> / ${pTot} g proteína</span></div><div class="fuel">`;
 p.meals.forEach(m=>{h+=`<button class="item meal" role="checkbox" aria-checked="${isOn(m[0])}" data-k="${m[0]}">${BOX}<span class="it"><span class="t">${esc(m[1])}</span><span class="d">${esc(m[3])}</span>${m[4]?`<span class="opt">${m[4]}</span>`:''}</span><span class="g">${m[2]||''}</span></button>`;});
 h+=`</div><details><summary>Proteína por porção</summary><div class="swap"><span>100 g de carne ou frango</span><span class="mono">30 g</span><span>1 copo de leite</span><span class="mono">8 g</span><span>30 g de leite em pó</span><span class="mono">8 g</span><span>1 ovo</span><span class="mono">6 g</span><span>1 fatia de queijo</span><span class="mono">5 g</span></div></details></section>`;

// persistence
let db=null,writing={},pending={};
const sync=document.getElementById('sync');
function setSync(t,c){sync.textContent=t;sync.className='sync '+(c||'');}
function saveLocal(){try{localStorage.setItem('hoje-checks',JSON.stringify(state));localStorage.setItem('hoje-loads',JSON.stringify(loads));}catch(e){}}
const timers={};
async function persist(k){
 saveLocal();
 if(!db){setSync('Salvo neste aparelho','warn');return;}
 if(writing[k]){pending[k]=true;return;}
 writing[k]=true;setSync('Salvando…');
 try{await db.doc('checks/'+k).set({items:state[k]||{},loads:loads[k]||{},updatedAt:new Date().toISOString()});setSync('Salvo','ok');}
 catch(e){setSync(e&&e.code==='invalid_argument'?'Só leitura':'Não salvou, tenta de novo','warn');}
 writing[k]=false;
 if(pending[k]){pending[k]=false;persist(k);}
}
function toggle(key){const cur=Object.assign({},state[sel]||{});if(cur[key])delete cur[key];else cur[key]=true;state[sel]=cur;render();persist(sel);}

document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('.item');if(b){toggle(b.dataset.k);return;}
 const w=e.target.closest('.wk');if(w){const n=+w.dataset.w,days=weekDays(n);sel=days.includes(TODAY)?TODAY:days[0];setView('day');}});
document.getElementById('main').addEventListener('input',e=>{

 const k=sel,key=t.dataset.l,val=t.value.trim();
 const cur=Object.assign({},loads[k]||{});if(val)cur[key]=val;else delete cur[key];loads[k]=cur;saveLocal();
 clearTimeout(timers[k]);setSync('Digitando…');
 timers[k]=setTimeout(()=>{delete timers[k];persist(k);},700);
});
document.getElementById('main').addEventListener('focusout',e=>{
 if(e.target.classList&&e.target.classList.contains('load')&&needRender){setTimeout(()=>{if(!(document.activeElement&&document.activeElement.classList.contains('load'))){needRender=false;render();}},0);}
});

document.getElementById('tabPlan').addEventListener('click',()=>setView('plan'));
document.getElementById('week').addEventListener('click',e=>{const b=e.target.closest('.day');if(b&&!b.disabled){sel=b.dataset.d;render();}});
document.getElementById('prev').addEventListener('click',()=>{if(sel>START){sel=addDays(sel,-1);render();}});
document.getElementById('next').addEventListener('click',()=>{if(sel<END){sel=addDays(sel,1);render();}});

render();setSync('Salvo neste aparelho','warn');
(async()=>{
 try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
 if(!db){setSync('Salvo neste aparelho','warn');return;}
 setSync('Sincronizado','ok');
 db.collection('checks').onSnapshot(snap=>{
  snap.docs.forEach(d=>{if(!writing[d.id]&&!pending[d.id]&&!timers[d.id]){const v=d.data();state[d.id]=(v&&v.items)||{};loads[d.id]=(v&&v.loads)||{};}});
