<style>
/* Layout: one focused column. The day's main session is the hero (km huge, like a bib number); everything else is a quiet checklist under it. Night-session palette: graphite + sodium-lamp amber. */
:root{

}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){

:root[data-theme="light"]{

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.bar-top{display:flex;justify-content:space-between;align-items:center;gap:8px}

header{display:flex;flex-direction:column;gap:6px}

.last{color:var(--accent);font-size:12.5px}

details{padding:0 2px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
summary::-webkit-details-marker{display:none}
summary::before{content:'+ '}

.swap{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin-top:8px}
.swap .mono{color:var(--ink);font-size:12px;text-align:right}

.exrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;border-top:1px solid var(--line)}
.exrow .item{border-top:0}

.load::placeholder{color:var(--muted)}
.loadwrap span{font-size:11px;color:var(--muted);font-family:var(--mono)}

.empty{text-align:center;padding:24px 8px;color:var(--muted)}
footer{display:flex;justify-content:center}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sync::before{content:'';display:inline-block;width:6px;height:6px;border-radius:9px;background:var(--muted);margin-right:6px;vertical-align:1px}
.sync.ok::before{background:var(--ok)}
.sync.warn::before{background:var(--accent)}

/* plan */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);margin-left:2px}
.stat .l{font-size:12px;color:var(--muted)}
.kmhero{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kmhero .km{font-size:84px;color:var(--accent);margin:0}
.kmhero span{color:var(--muted);font-size:14px}
.wk{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line);text-align:left;width:100%}

.wk-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wk-n{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.03em}

.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);color:var(--muted)}
.dot b{width:100%;height:5px;border-radius:9px;background:var(--line);display:block;position:relative;overflow:hidden}
.dot b i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.dot b.full i{background:var(--ok)}
.dot.q{color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:380px){.km{font-size:92px}.big{font-size:54px}h1{font-size:30px}}
</style>

 '2026-11-23':['leve',6],'2026-11-24':['qual',7,'800 m repetições'],'2026-11-26':['qual',6,'Corrida progressiva com repetições'],'2026-11-28':['longao',10,'','Primeira vez nos 10 km. Leve do começo ao fim, sem olhar o pace.'],

 if(GYM_ON&&(dow===1||dow===3)){blocks.bike='20–30 min leve';items.push('bike');}
 if(dow===0&&!r){blocks.along=true;items.push('along');}
 blocks.meals=meals(r&&(r[0]==='longao'||r[0]==='prova')?'long':(dow===0&&!r?'rest':'normal'));blocks.meals.forEach(m=>items.push(m[0]));
 items.push('creatina','agua');
 blocks.items=items;
 return blocks;
}
function stats(k){const p=plan(k);if(!p)return null;const s=state[k]||{};const done=p.items.filter(i=>s[i]).length;return {done,total:p.items.length};}

const CHECK='<svg viewBox="0 0 14 14" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"/></svg>';
function row(key,title,desc,extra){
 const on=!!(state[sel]||{})[key];
 return `<button class="item" role="checkbox" aria-checked="${on}" data-k="${key}"><span class="box">${CHECK}</span><span class="it"><span class="t">${title}</span>${desc?`<span class="d">${desc}</span>`:''}${extra||''}</span></button>`;
}

let view='day';
const weekStart=n=>addDays(START,7*(n-1));
const weekDays=n=>{const s=weekStart(n);return [0,1,2,3,4,5,6].map(i=>addDays(s,i));};
function fmtD(k){const d=fromKey(k);return d.getUTCDate()+' '+MON[d.getUTCMonth()];}
const pc=(a,b)=>b?Math.round(a/b*100):0;

function renderPlan(){
 const all=[];for(let k=START;k<=END;k=addDays(k,1))all.push(k);
 let kmT=0,kmD=0,runT=0,runD=0,gymT=0,gymD=0,mealT=0,mealD=0,full=0,past=0;
 all.forEach(k=>{const p=plan(k),s=state[k]||{};const r=RUNS[k];
  if(r){kmT+=r[1];runT++;if(s.run){kmD+=r[1];runD++;}}
  if(p.gym){gymT++;if(p.gym[2].every((_,i)=>s['g'+i]))gymD++;}
  p.meals.forEach(m=>{if(k<=TODAY){mealT++;if(s[m[0]])mealD++;}});
  if(k<=TODAY){past++;const st=stats(k);if(st.done===st.total)full++;}
 });
 const curW=TODAY<START?0:TODAY>END?NWEEKS:weekNum(TODAY);
 let h=`<header><span class="eyebrow">Prova de 8 km · <b>13 dez</b></span><h1>${curW?'Semana '+curW+' de '+NWEEKS:'Começa 19 out'}</h1></header>`;
 h+=`<div class="kmhero"><span class="km">${kmFmt(Math.round(kmD*10)/10)}</span><span>de ${kmFmt(Math.round(kmT*10)/10)} km corridos</span></div>`;
 h+=`<div class="stats">
  <div class="stat"><span class="v">${runD}<small>/${runT}</small></span><span class="l">corridas</span></div>
  ${GYM_ON?`<div class="stat"><span class="v">${gymD}<small>/${gymT}</small></span><span class="l">academia</span></div>`:''}
  <div class="stat"><span class="v">${pc(mealD,mealT)}<small>%</small></span><span class="l">dieta</span></div>
  <div class="stat"><span class="v">${full}<small>/${past}</small></span><span class="l">dias 100%</span></div>
 </div>`;
 h+=`<section><div class="sh"><h2>Semanas</h2></div><div class="card weeks">`;
 for(let n=1;n<=NWEEKS;n++){const days=weekDays(n);let wT=0,wD=0;days.forEach(k=>{const r=RUNS[k];if(r){wT+=r[1];if((state[k]||{}).run)wD+=r[1];}});
  let dots='';
  days.forEach(k=>{const st=stats(k),p2=st?pc(st.done,st.total):0,r=RUNS[k];dots+=`<span class="dot ${r&&r[0]!=='leve'?'q':''}"><b class="${st&&st.total&&st.done===st.total?'full':''}"><i style="width:${p2}%"></i></b>${r?kmFmt(r[1]):'·'}</span>`;});
  h+=`<button class="wk ${n===curW?'cur':''}" data-w="${n}"><div class="wk-top"><span class="wk-n">Semana ${n}<span class="wk-d">${fmtD(days[0])} – ${fmtD(days[6])}</span></span><span class="wk-km">${kmFmt(Math.round(wD*10)/10)}/${kmFmt(Math.round(wT*10)/10)} km</span></div><div class="dots">${dots}</div></button>`;}
 h+='</div></section>';
 document.getElementById('main').innerHTML=h;
}
function setView(v){view=v;document.getElementById('tabDay').setAttribute('aria-selected',v==='day');document.getElementById('tabPlan').setAttribute('aria-selected',v==='plan');
 document.getElementById('dayHead').hidden=v!=='day';document.getElementById('week').hidden=v!=='day';document.getElementById('navBox').hidden=v!=='day';render();window.scrollTo(0,0);}
function lastLoad(gk,i,before){
 for(let k=addDays(before,-1);k>=START;k=addDays(k,-1)){
  if(gymKeyFor(k)===gk){const v=(loads[k]||{})['g'+i];if(v)return {v,k};}
 }
 return null;
}
function exRow(i,e,gk){
 const unit=CASA[gk]?'reps':'kg';
 const key='g'+i,on=!!(state[sel]||{})[key],v=(loads[sel]||{})[key]||'',last=lastLoad(gk,i,sel);
 const lastTxt=last?`<span class="last">última: ${esc(last.v)} ${unit} · ${fmtD(last.k)}</span>`:'';
 return `<div class="exrow"><button class="item" role="checkbox" aria-checked="${on}" data-k="${key}"><span class="box">${CHECK}</span><span class="it"><span class="t">${esc(e[0])}</span><span class="d"><span class="mono">${esc(e[1])}</span>${e[2]?' · '+esc(e[2]):''}</span>${lastTxt}</span></button><label class="loadwrap"><input class="load" id="load-${key}" data-l="${key}" inputmode="decimal" autocomplete="off" maxlength="10" placeholder="—" value="${esc(v)}" aria-label="${unit==='reps'?'Reps':'Carga'} em ${esc(e[0])}"><span>${unit}</span></label></div>`;
}
let needRender=false;

const TYPE={leve:['Leve',false,'Ritmo de conversa. No fim, 4–6 acelerações soltas de 20 s.'],
 qual:['Qualidade',true,'Aquece bem e segue o áudio do Runna. Perna muito pesada? Faz leve.'],
 longao:['Longão',true,'Leve do começo ao fim. Completar sem parar é o objetivo.'],
 prova:['Prova',true,'']};
function hero(k,p){
 if(p.run){const [t,km,name,desc]=p.run;const [label,hot,def]=TYPE[t];
  const on=!!(state[sel]||{}).run;
  return `<section class="hero ${hot?'hot':'easy'}"><span class="pill ${hot?'hot':''}">${label}</span>
   <div class="km">${kmFmt(km)}<small>km</small></div>
   ${name?`<h2 class="rname">${esc(name)}</h2>`:''}
   <p class="rd">${esc(desc||def)}</p>
   <button class="item done" role="checkbox" aria-checked="${on}" data-k="run"><span class="box">${CHECK}</span>${on?'Corrida feita':'Marcar corrida feita'}</button></section>`;}
 const nx=RUNS[addDays(k,1)];
 const tomorrow=nx?(nx[0]==='longao'?'Amanhã tem longão de '+kmFmt(nx[1])+' km.':nx[0]==='prova'?'Amanhã é a prova.':'Amanhã: '+kmFmt(nx[1])+' km.'):'';
 const note=p.along?'Recuperação ativa e sem a refeição do acordar.':'Sem corrida hoje.';
 return `<section class="hero easy"><span class="pill">${p.along?'Descanso':'Livre'}</span>
  <div class="big">${p.along?'Recupera':'Folga'}</div>
  <p class="rd">${note}${tomorrow?' '+tomorrow:''}</p>
  ${p.along?`<div class="list">${row('along','Alongamento','<span class="mono">10–15 min</span> · quadril, posterior e panturrilha')}</div>`:''}</section>`;
}
function render(){
 if(view==='plan'){renderPlan();return;}
 const d=fromKey(sel),dow=d.getUTCDay();
 document.getElementById('title').textContent=DOW[dow]+', '+d.getUTCDate()+' '+MON[d.getUTCMonth()];
 document.getElementById('eyebrow').innerHTML='Semana '+weekNum(sel)+' de '+NWEEKS+(sel===TODAY?' · <b>hoje</b>':'');
 document.getElementById('todayBtn').hidden=(sel===TODAY)||TODAY<START||TODAY>END;
 document.getElementById('prev').disabled=sel<=START;
 document.getElementById('next').disabled=sel>=END;
 const p=plan(sel);
 const st=stats(sel)||{done:0,total:0};
 const bar=document.getElementById('bar');bar.firstElementChild.style.width=pc(st.done,st.total)+'%';bar.classList.toggle('full',st.total&&st.done===st.total);
 document.getElementById('count').textContent=st.done+'/'+st.total;

 const mon=addDays(sel,-((dow+6)%7));
 let wk='';
 for(let i=0;i<7;i++){const k=addDays(mon,i),dd=fromKey(k),s=stats(k);const r=RUNS[k];
  wk+=`<button class="day ${k===sel?'sel':''} ${k===TODAY?'now':''}" data-d="${k}" ${s?'':'disabled'} aria-label="${DOW[dd.getUTCDay()]} ${dd.getUTCDate()}"><span class="dl">${DOWS[dd.getUTCDay()]}</span><span class="dn">${dd.getUTCDate()}</span><span class="tag ${r&&r[0]!=='leve'?'q':''}">${r?kmFmt(r[1]):''}</span><span class="mini ${s&&s.total&&s.done===s.total?'full':''}"><i style="width:${s?pc(s.done,s.total):0}%"></i></span></button>`;}
 document.getElementById('week').innerHTML=wk;

 const main=document.getElementById('main');
 if(!p){main.innerHTML='<div class="empty">Nada planejado pra esse dia.</div>';return;}
 let h=hero(sel,p);
 if(p.gym){const [n,tag,ex]=p.gym;
  h+=`<section><div class="sh"><h2>${n}</h2><span class="aside">${tag}</span></div><p class="sub">5 min de bike + 2 séries leves no primeiro. Anota a carga ao lado.</p><div class="card list">`;
  ex.forEach((e,i)=>{h+=exRow(i,e,p.gymKey);});
  if(p.bike) h+=row('bike','Bike ergométrica',`<span class="mono">${p.bike}</span>`);
  h+='</div></section>';}
 h+=`<section><div class="sh"><h2>Dieta</h2><span class="aside">165 g proteína</span></div><div class="card list">`;
 p.meals.forEach(m=>{h+=row(m[0],esc(m[1])+(m[2]?`<span class="pro">${m[2]}</span>`:''),esc(m[3]),(m[4]?`<span class="opt">${m[4]}</span>`:''));});
 h+=`</div><details><summary>Proteína por porção</summary><div class="swap"><span>100 g de carne ou frango</span><span class="mono">30 g</span><span>1 copo de leite</span><span class="mono">8 g</span><span>30 g de leite em pó</span><span class="mono">8 g</span><span>1 ovo</span><span class="mono">6 g</span><span>1 fatia de queijo</span><span class="mono">5 g</span></div></details></section>`;
 h+=`<section><div class="sh"><h2>Todo dia</h2></div><div class="card list">${row('creatina','Creatina','<span class="mono">3–5 g</span> · em qualquer refeição')}${row('agua','Água','<span class="mono">3 L</span>')}</div></section>`;
 main.innerHTML=h;
}

// persistence
let db=null,writing={},pending={};
const sync=document.getElementById('sync');
function setSync(t,c){sync.textContent=t;sync.className='sync '+(c||'');}
function saveLocal(){try{localStorage.setItem('hoje-checks',JSON.stringify(state));localStorage.setItem('hoje-loads',JSON.stringify(loads));}catch(e){}}
const timers={};
async function persist(k){
 saveLocal();
 if(!db){setSync('Salvo neste aparelho','warn');return;}
 if(writing[k]){pending[k]=true;return;}
 writing[k]=true;setSync('Salvando…');
 try{await db.doc('checks/'+k).set({items:state[k]||{},loads:loads[k]||{},updatedAt:new Date().toISOString()});setSync('Salvo','ok');}
 catch(e){setSync(e&&e.code==='invalid_argument'?'Só leitura':'Não salvou, tenta de novo','warn');}
 writing[k]=false;
 if(pending[k]){pending[k]=false;persist(k);}
}
function toggle(key){const cur=Object.assign({},state[sel]||{});if(cur[key])delete cur[key];else cur[key]=true;state[sel]=cur;render();persist(sel);}

document.getElementById('main').addEventListener('click',e=>{const b=e.target.closest('.item');if(b){toggle(b.dataset.k);return;}
 const w=e.target.closest('.wk');if(w){const n=+w.dataset.w,days=weekDays(n);sel=days.includes(TODAY)?TODAY:days[0];setView('day');}});
document.getElementById('main').addEventListener('input',e=>{
 const t=e.target;if(!t.classList||!t.classList.contains('load'))return;
 const k=sel,key=t.dataset.l,val=t.value.trim();
 const cur=Object.assign({},loads[k]||{});if(val)cur[key]=val;else delete cur[key];loads[k]=cur;saveLocal();
 clearTimeout(timers[k]);setSync('Digitando…');
 timers[k]=setTimeout(()=>{delete timers[k];persist(k);},700);
});
document.getElementById('main').addEventListener('focusout',e=>{
 if(e.target.classList&&e.target.classList.contains('load')&&needRender){setTimeout(()=>{if(!(document.activeElement&&document.activeElement.classList.contains('load'))){needRender=false;render();}},0);}
});
document.getElementById('tabDay').addEventListener('click',()=>setView('day'));
document.getElementById('tabPlan').addEventListener('click',()=>setView('plan'));
document.getElementById('week').addEventListener('click',e=>{const b=e.target.closest('.day');if(b&&!b.disabled){sel=b.dataset.d;render();}});
document.getElementById('prev').addEventListener('click',()=>{if(sel>START){sel=addDays(sel,-1);render();}});
document.getElementById('next').addEventListener('click',()=>{if(sel<END){sel=addDays(sel,1);render();}});
document.getElementById('todayBtn').addEventListener('click',()=>{sel=TODAY;render();});

render();setSync('Salvo neste aparelho','warn');
(async()=>{
 try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
 if(!db){setSync('Salvo neste aparelho','warn');return;}
 setSync('Sincronizado','ok');
 db.collection('checks').onSnapshot(snap=>{
  snap.docs.forEach(d=>{if(!writing[d.id]&&!pending[d.id]&&!timers[d.id]){const v=d.data();state[d.id]=(v&&v.items)||{};loads[d.id]=(v&&v.loads)||{};}});
  saveLocal();
  if(document.activeElement&&document.activeElement.classList.contains('load'))needRender=true;else render();
 },()=>setSync('Salvo neste aparelho','warn'));
})();
})();
</script>

</body></html>
